# Religion-conversion scoring constants for Families and Characters.
#
# These values are NOT in XML — they live in the game's compiled code. The
# spreadsheet documents them, and dev (Solver, 2023-02-09 Discord) confirmed
# the family scoring directly: "100 points for each family character following
# it, but the family head gets 200. Council members get an additional 40 and
# non-council jobs get 20 points. The religion the family currently follows
# gets an extra 50 points."
#
# Update if Mohawk changes the constants. Diff-friendly format.

family:
  cooldownTurns: 4
  # Constants applied per character to compute each religion's score.
  scoring:
    - { points: 200, label: "Family head following that religion" }
    - { points: 100, label: "Other family characters" }
    - { points: 40,  label: "Council members (additional)" }
    - { points: 20,  label: "Non-council jobs — governor / general / agent (additional)" }
    - { points: 50,  label: "Current religion bonus" }

character:
  # Who triggers a roll
  whoRolls:
    - "Leader characters of human players never randomly choose a religion."
    - >-
      Other characters skip the roll if any other 'life event' happens that
      turn: giving birth (after Pregnant), gaining/losing a random adult trait,
      fathering a child, gaining/losing a random stat point, gaining a random
      archetype, or a random marriage proposal.
    - "All other characters: 10% per-turn chance to attempt a religion choice."
    - >-
      Adults always attempt once that 10% hurdle is cleared. Characters aged
      ≤17 attempt with probability 1 / (1 + YluA), where YluA = years left
      until adulthood.

  # The threshold mechanic
  threshold:
    description: >-
      A random integer 1..3 is drawn. The religion's points from *cities alone*
      must meet or exceed the threshold for it to be eligible. The highest-
      scoring eligible religion wins. If none qualify, no religion is chosen.

  # City-based scoring — these are the threshold-eligibility points
  cityScoringWithFamily:
    note: "If the character has a family, only family cities count."
    rules:
      - { points: 4, label: "Family seat is the holy city" }
      - { points: 3, label: "Any other family city is the holy city" }
      - { points: 2, label: "Religion in family seat (not the holy city)" }
      - { points: 1, label: "Religion in other family cities (not the holy city)" }
  cityScoringNoFamily:
    note: "Initial rulers, foreigners, anyone without a family. All player cities count, weighted less."
    rules:
      - { points: 2, label: "Player has the holy city" }
      - { points: 1, label: "Religion in player cities (not the holy city)" }

  # Role-based modifiers (family doesn't matter)
  roleScoring:
    note: "These stack regardless of family affiliation."
    rules:
      - { points: 3, label: "Governor of the holy city" }
      - { points: 2, label: "Governor of a city with that religion (not the holy city)" }
      - { points: 2, label: "Agent in the holy city" }
      - { points: 1, label: "Agent in a city with that religion (not the holy city)" }

  # Final-roll adjustments — only applied to religions that already cleared the threshold
  postThreshold:
    note: "Only religions that passed the threshold get these final modifiers."
    rules:
      - { points: 3, label: "Religion is Pagan (even if from the wrong nation)" }
      - { points: "0-3", label: "If <4 characters follow that religion, add (4 - number_of_characters) to the score" }

  # The final tiebreaker
  randomization: "The post-threshold sum is multiplied by a random integer 5..14. The highest result wins."
