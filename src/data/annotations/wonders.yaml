# Curation layer for Wonders — the ONE thing the game XML does not encode:
# alcaras'''s multiplayer tier rating and strategy notes, seeded from the
# legacy Old World Reference Spreadsheet (Wonders tab). Everything else on
# the Wonders page (cost, culture tier, requirements, VP, per-turn yields,
# and the scope-bucketed effect text) is derived from improvement.xml — see
# scripts/build_wonders.py. These are subjective MP takes frozen at seed
# time; hand-edit as balance shifts. Keyed by wonder slug (zType minus the
# IMPROVEMENT_ prefix, lowercased).
#
# tier: S/A/B letter grade, or a free-text caveat ("highly map dependent",
#       "disabled in duels", "only for VP") straight from the SS.
# notes: strategy commentary. A leading "[DLC]" marker was dropped (the page
#        already shows a DLC chip).

wonders:
  acropolis:
    notes: Does require Forums to be effective.
    tier: B
  al_khazneh:
    notes: Disabled in Duels.
    tier: disabled in duels
  apadana:
    notes: Significant money per turn thanks to the global maintenance reduction (which
      is additive, not multiplicative, so it's better than it seems!)
    tier: A
  circus_maximus:
    notes: Just in case your Cataphracts were not strong enough :)
    tier: A
  colosseum:
    notes: Can be very powerful if built early, and Training/Pop can be strong if you
      build it in your primary military city (though getting that legendary may be a
      challenge)
    tier: S
  colossus:
    notes: +2 Civics in every Connected city is quite strong (and you should have everything
      connected); the +1 level for new units is gravy on top
    tier: A
  cothon:
    notes: It can be totally uselss or game defining. It's awesome for duels on Indland
      Sea and similar maps.
    tier: highly map dependent
  great_ziggurat:
    notes: A quiet but strong wonder. The improvement cost early can be great. There
      are also some nice event chains for having this wonder (e.g. +10% training in
      the city).
    tier: A
  hagia_sophia:
    notes: Two Happiness levels on completion in every city can help if you're struggling
      with Discontent
    tier: A
  hanging_gardens:
    notes: Can help supercharge growth early, and combos well with a high-wis Chancellor
    tier: B
  heliopolis:
    notes: Very strong with Polytheism (all those shrines turn into orders!). Kush get
      0.75/orders per shrine.
    tier: S
  hill_fort:
    notes: Provides 12 base training, which is roughly the same as Colosseum. +4hp per
      turn to all units means that it gets a lot easier to defend. Build it if you're
      going for a points/ambition victory and need to buy time/deter opponent from attacking
      you.
    tier: A
  ishtar_gate:
    notes: Use to snipe double victory wins or getting all your cities to be able to
      rush. Build after you've settled everything you want to settle. (You can "reserve
      it" by starting it, moving the worker off, and only finishing when all cities
      settled).
    tier: B
  jebel_barkal:
    notes: Lets you get Temples without Doctrine. Picks a random World Religion for
      the temple. Spread religion with disciples before you complete it for max effect.
      (You can "reserve it" by starting it, moving the worker off, and only finishing
      when all cities have religion).
    tier: S
  jerwan_aqueduct:
    notes: The free Farmers will added even if the Farm is built after the Wonder. Can
      be strong for Sages (+1 sci/farmer) or Landowners (extra gold). Look for a Volcano
      with lush terrain around.
    tier: B
  lighthouse:
    notes: Prioritize this on Archipelago. Some niche uses to be able to expand borders
      over water, since it's usually available well before Harbor.
    tier: highly map dependent
  mausoleum:
    notes: Global +%Culture can accelerate your path to a points victory, or help secure
      a key legendary wonder
    tier: B
  monumental_buddhas:
    notes: A lot better in SP than in MP. +60 opinion with all religions also means
      +60 opinion with all families that follow any religion. If Buddhism isn't present,
      it gets founded upon completion. 2 culture per religion is solid if you're going
      for multi-faith Tolerance playthrough.
    tier: B
  musaeum:
    notes: Very strong in a science city / capital.
    tier: S
  necropolis:
    notes: Can be strong if you are going Polytheism. That's a lot of civics. Big Culture
      boost in city with lots of specialists.
    tier: A
  oracle:
    notes: You won't be able to assign an agent until you get a Spymaster, but choosing
      from 5 tech cards is great
    tier: B
  pantheon:
    notes: You'll need to prioritize culture in a Holy City to get this up and running.
      Sages seats are great for this, if you found a pagan religion with a shrine in
      them.
    tier: A
  pyramids:
    notes: Incredibly good, saves you so much civics over the course of the game. Prioritize
      in every game it's buildable. Remember it requires an Arid/Sand tile.
    tier: S
  royal_library:
    notes: Disabled in Duels. Requires Peace with a Nation in order to get the connected
      Bonus. As well as explored territory with a road/river/ocean route to the nation.
    tier: disabled in duels
  stupa:
    notes: Great for wide games where you are rich on civics and poor on stone. Combos
      well with Yaz and other civic-based wonders. Pillar edicts can be built anywhere,
      take 1 turn and cost only 10 stone, so prioritize them.
    tier: A
  the_mahavihara:
    notes: Awesome if you're going for a Scholariship beeline. Try to position your
      libraries adjacent to resources for maximum effect (you can build over a hamlet).
      Civics per specialist males it a lot easier to produce more specialists, creating
      a virtous cycle.
    tier: B
  via_recta_souk:
    notes: Everything about this wonder is too late to matter in MP. Use it in SP with
      ruthless AI to guarantee 1 peaceful relationship till the very end of the game.
    tier: only for VP
  yazilikaya:
    notes: 'Combos very well with other city-based civics boosts where your state religion
      is: Legalism, Civics families, other civics based wonders like Colossus and Necropolis
      will all synergize with this wonder'
    tier: B
  